<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapa de Entregas – PoC Logística</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #root { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1c2430; }
      .app { display: flex; flex-direction: column; height: 100%; }
      header { padding: 14px 20px 10px; background: #fff; border-bottom: 1px solid #e4e7ec; }
      h1 { margin: 0 0 2px; font-size: 20px; }
      .sub { margin: 0 0 12px; font-size: 13px; color: #5b6573; }
      .kpis { display: flex; gap: 12px; flex-wrap: wrap; }
      .kpi { flex: 1 1 150px; background: #f6f7f9; border-radius: 8px; padding: 10px 14px; }
      .kpi b { display: block; font-size: 26px; line-height: 1.1; }
      .kpi span { font-size: 12px; color: #5b6573; }
      .kpi.alerta b { color: #c2410c; }
      .controls { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; font-size: 13px; align-items: center; }
      .controls button { border: 1px solid #cfd4dc; background: #fff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font: inherit; }
      .controls button.on { background: #1c2430; color: #fff; border-color: #1c2430; }
      .legend { display: flex; gap: 12px; margin-left: auto; color: #5b6573; }
      .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
      .map { position: relative; flex: 1; }
      .attr { position: absolute; right: 6px; bottom: 4px; font-size: 11px; background: rgba(255,255,255,.8); padding: 1px 5px; border-radius: 3px; }
      .msg { position: absolute; inset: 0; display: grid; place-items: center; font-size: 15px; color: #5b6573; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
